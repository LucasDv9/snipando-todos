<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 16px;
    width: 220px;
    background: #0a0a0e;
    color: #e8e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 12px;
  }
  h3 {
    margin: 0 0 4px;
    font-size: 13px;
    color: #c4b5fd;
    letter-spacing: .8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 6px #4ade80;
  }
  p  { margin: 0 0 10px; color: #6a6a7a; font-size: 11px; }
  .tag {
    display: inline-block;
    margin-top: 4px;
    padding: 2px 6px;
    background: #1a1a22;
    border: 1px solid #2a2a30;
    border-radius: 4px;
    color: #a78bfa;
    font-size: 10px;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <h3><span class="dot"></span>PRIZE SNIPER</h3>
  <span class="tag">ADMIN · standalone</span>
  <p style="margin-top:12px">Bot ativo. Abra o jogo no pokgaming que ele entra sozinho.</p>
</body>
</html>
